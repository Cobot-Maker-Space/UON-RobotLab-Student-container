name: Build dev container image (pick an OS branch first)

# This file exists on 'main' for exactly one reason: GitHub only offers the Actions tab's
# "Run workflow" button for a workflow_dispatch workflow that exists on the DEFAULT branch, and
# only renders the inputs it declares. Delete this file and the button disappears for every
# branch - so the inputs below mirror the real ones on windows/linux/macos.
#
# 'main' publishes no image of its own. There is no OS-agnostic dev container here: windows and
# linux each carry their own src/.devcontainer/ and a copy of this workflow that publishes their
# own GHCR package (both linux/amd64). macos publishes nothing - Macs run the linux image under
# Rosetta, and macos's copy of this workflow is a guard like this one. When you dispatch, the run
# uses the workflow file from whatever you pick in "Use workflow from" - so pick a branch.
# This job exists to say so clearly rather than fail somewhere confusing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. humble-sim-2026-09). Must match the pin in devcontainer.json."
        required: true
        default: humble-sim-2026-09
      push_latest:
        description: "Also move the ':latest' tag on the package."
        type: boolean
        required: false
        default: true

jobs:
  wrong-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Explain that main does not publish an image
        run: |
          echo "::error::This workflow was dispatched from '${GITHUB_REF_NAME}', which publishes no image."
          echo "::error::Re-run it and set 'Use workflow from' to windows or linux (macos uses the linux image)."
          {
            echo "### Nothing was built"
            echo ""
            echo "\`main\` has no dev container of its own. These branches publish images:"
            echo ""
            echo "| Branch | Publishes | Platform |"
            echo "|---|---|---|"
            echo "| \`windows\` | \`ghcr.io/cobot-maker-space/robotlab-devcontainer-windows\` | linux/amd64 |"
            echo "| \`linux\` | \`ghcr.io/cobot-maker-space/robotlab-devcontainer-linux\` | linux/amd64 — also used by \`macos\`, under Rosetta |"
            echo ""
            echo "Re-run this workflow with **Use workflow from** set to \`windows\` or \`linux\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
