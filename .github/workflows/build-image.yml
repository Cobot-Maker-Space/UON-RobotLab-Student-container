name: Build dev container image (pick an OS branch first)

# This file exists on 'main' for exactly one reason: GitHub only offers the Actions tab's
# "Run workflow" button for a workflow_dispatch workflow that exists on the DEFAULT branch, and
# only renders the inputs it declares. Delete this file and the button disappears for every
# branch - so the inputs below mirror the real ones on windows/linux/macos.
#
# 'main' publishes no image of its own. There is no OS-agnostic dev container here: each of
# windows, linux and macos carries its own src/.devcontainer/ and its own copy of this workflow,
# targeting a different GHCR package and a different CPU architecture. When you dispatch, the
# run uses the workflow file from whatever you pick in "Use workflow from" - so pick a branch.
# This job exists to say so clearly rather than fail somewhere confusing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. humble-sim-2026-09). Must match the pin in devcontainer.json."
        required: true
        default: humble-sim-2026-09
      push_latest:
        description: "Also move the ':latest' tag on the package."
        type: boolean
        required: false
        default: true

jobs:
  wrong-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Explain that main does not publish an image
        run: |
          echo "::error::This workflow was dispatched from '${GITHUB_REF_NAME}', which publishes no image."
          echo "::error::Re-run it and set 'Use workflow from' to one of: windows, linux, macos."
          {
            echo "### Nothing was built"
            echo ""
            echo "\`main\` has no dev container of its own. Each OS branch carries its own image and its own copy of this workflow:"
            echo ""
            echo "| Branch | Publishes | Platform |"
            echo "|---|---|---|"
            echo "| \`windows\` | \`ghcr.io/cobot-maker-space/robotlab-devcontainer-windows\` | linux/amd64 |"
            echo "| \`linux\` | \`ghcr.io/cobot-maker-space/robotlab-devcontainer-linux\` | linux/amd64 |"
            echo "| \`macos\` | \`ghcr.io/cobot-maker-space/robotlab-devcontainer-macos\` | linux/arm64 |"
            echo ""
            echo "Re-run this workflow with **Use workflow from** set to one of those branches."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
