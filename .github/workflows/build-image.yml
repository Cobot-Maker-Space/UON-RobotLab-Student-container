name: Build dev container image (macOS / arm64)

# Publishes the base ROS 2 dev container image used by src/.devcontainer/devcontainer.json on
# this branch. This is the macOS variant: it targets Apple Silicon (arm64) and is built and
# published separately from the windows/linux branches, which target amd64.
#
# This image bakes in ROS 2 Humble, the desktop/Gazebo/noVNC packages, and setup.sh - but NOT a
# compiled turtlebot3 workspace. The workspace is still cloned and built at container-creation
# time by postCreateCommand (see setup.sh), with build/install/log persisted via the cache/
# bind-mounts in devcontainer.json. Publishing this image just means students pull a ready-made
# ROS+desktop+noVNC environment instead of apt-installing it locally on every fresh clone.
#
# FIRST RUN: GHCR creates new packages PRIVATE by default. After the first successful push, go to
# the package settings on GitHub and set its visibility to Public - otherwise every machine needs
# 'docker login' before it can pull.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. humble-sim-2026-09). Must match the pin in devcontainer.json."
        required: true
        default: humble-sim-2026-09
      push_latest:
        description: "Also move the ':latest' tag on the package."
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "humble-sim-*"

env:
  REGISTRY: ghcr.io
  # The owner is 'Cobot-Maker-Space' but GHCR rejects any uppercase in a repository name, so the
  # full image name is lowercased in the 'meta' step rather than built here.
  IMAGE_BASENAME: robotlab-devcontainer-macos

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # arm64 desktop packages take real disk. This reclaims ~20 GB of preinstalled toolchains we
      # do not use, so the build does not die partway through with "no space left on device".
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Resolve image name and tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_BASENAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_name=${OWNER}/${IMAGE_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE}:${TAG}"

      # Guard against publishing an image tag that devcontainer.json does not point at. A student
      # on this branch would get 'manifest unknown'.
      - name: Verify devcontainer.json pins the tag being built
        run: |
          PINNED=$(grep -oP '^\s*"image"\s*:\s*"\K[^"]+' src/.devcontainer/devcontainer.json)
          EXPECTED="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          echo "devcontainer.json pins: ${PINNED}"
          echo "this build publishes:   ${EXPECTED}"
          if [ "${PINNED}" != "${EXPECTED}" ]; then
            echo "::error::devcontainer.json pins '${PINNED}' but this run publishes '${EXPECTED}'."
            echo "::error::Update the 'image' field in src/.devcontainer/devcontainer.json to match, or build the tag it already pins."
            exit 1
          fi

      # arm64 needs QEMU emulation to build/run on this (amd64) runner - there is no free
      # arm64-hosted runner here. Without this, 'platforms: linux/arm64' below fails outright.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repository root, not src/.devcontainer - kept consistent with the other branches even
          # though this Dockerfile does not COPY anything from src/ itself. See .dockerignore.
          context: .
          file: src/.devcontainer/Dockerfile
          # macOS on Apple Silicon is arm64. This is the one branch that needs it: osrf/ros images
          # only ship amd64, which is why the Dockerfile's BASE_IMAGE defaults to ros:humble
          # (multi-arch) instead. Emulated arm64 builds are noticeably slower than native amd64.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ (github.event_name == 'push' || inputs.push_latest) && format('{0}:latest', steps.meta.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually has the desktop/simulation stack in it, not just a bare ROS
      # install. Runs under QEMU emulation since this is an arm64 image on an amd64 runner.
      - name: Smoke test the published image
        run: |
          IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker pull "$IMAGE"

          echo "--- core ROS packages resolve? ---"
          docker run --rm --platform linux/arm64 "$IMAGE" bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 pkg prefix navigation2 && ros2 pkg prefix slam_toolbox'

          echo "--- gazebo baked in, not apt-installed at runtime? ---"
          docker run --rm --platform linux/arm64 "$IMAGE" bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 pkg prefix gazebo_ros' \
            || echo "::warning::gazebo_ros did not resolve on arm64 - Gazebo Classic's arm64 packaging is known to be flaky. Falls back to the runtime apt-get install in setup.sh."

          echo "--- noVNC tooling present? ---"
          docker run --rm --platform linux/arm64 "$IMAGE" bash -lc 'command -v websockify && dpkg -l novnc >/dev/null'

          echo "--- setup.sh present and executable? ---"
          docker run --rm --platform linux/arm64 "$IMAGE" test -x /usr/local/bin/setup.sh \
            || { echo "::error::setup.sh missing from the image - postCreateCommand would fail for every student."; exit 1; }

      - name: Remind about package visibility
        run: |
          echo "### Published \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If this was the first push, the package is **private**. Machines cannot pull a private package without \`docker login\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Set it to Public under the package settings, then verify anonymously:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "R=${{ steps.meta.outputs.image_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'T=$(curl -s "https://ghcr.io/token?scope=repository:$R:pull&service=ghcr.io" | jq -r .token)' >> "$GITHUB_STEP_SUMMARY"
          echo 'curl -H "Authorization: Bearer $T" "https://ghcr.io/v2/$R/tags/list"' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
