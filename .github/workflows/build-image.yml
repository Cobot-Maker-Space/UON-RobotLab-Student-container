name: Build dev container image (Linux / amd64)

# Publishes the base ROS 2 dev container image that src/.devcontainer/devcontainer.json on this
# branch pulls. This is the native-Linux variant, targeting amd64 - see the windows and macos
# branches for their own copies of this workflow (same shape, different image name and platform).
#
# This image bakes in ROS 2 Humble and the Gazebo/Nav2/RViz packages - but NOT a compiled
# turtlebot3 workspace. devcontainer.json bind-mounts the host's src/ and cache/humble/ over
# /home/ros2_ws/{src,build,install,log}, so anything baked in at those paths would just be
# shadowed at container start. The workspace is cloned and built at container-creation time by
# postCreateCommand (see setup.sh), incrementally after the first run. What students skip by
# pulling this image is the ~10 minute apt-get-everything step on every fresh clone.
#
# It deliberately contains no VNC server or desktop environment: the X server lives in the
# separate theasp/novnc container that start_vnc.sh brings up. See the Dockerfile.
#
# FIRST RUN: GHCR creates new packages PRIVATE by default. After the first successful push, go to
# the package settings on GitHub and set its visibility to Public - otherwise every machine needs
# 'docker login' before it can pull.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. humble-sim-2026-09). Must match the pin in devcontainer.json."
        required: true
        default: humble-sim-2026-09
      push_latest:
        description: "Also move the ':latest' tag on the package."
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "humble-sim-*"

env:
  REGISTRY: ghcr.io
  # The owner is 'Cobot-Maker-Space' but GHCR rejects any uppercase in a repository name, so the
  # full image name is lowercased in the 'meta' step rather than built here.
  IMAGE_BASENAME: robotlab-devcontainer-linux

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ROS 2 Humble plus Gazebo and Nav2 on top of the base image takes real disk. This reclaims
      # ~20 GB of preinstalled toolchains we do not use, so the build does not die partway
      # through with a confusing "no space left on device".
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Resolve image name and tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_BASENAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_name=${OWNER}/${IMAGE_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE}:${TAG}"

      # Guard against publishing an image tag that devcontainer.json does not point at. A student
      # on this branch would get 'manifest unknown' and no way to tell why.
      - name: Verify devcontainer.json pins the tag being built
        run: |
          PINNED=$(grep -oP '^\s*"image"\s*:\s*"\K[^"]+' src/.devcontainer/devcontainer.json)
          EXPECTED="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          echo "devcontainer.json pins: ${PINNED}"
          echo "this build publishes:   ${EXPECTED}"
          if [ "${PINNED}" != "${EXPECTED}" ]; then
            echo "::error::devcontainer.json pins '${PINNED}' but this run publishes '${EXPECTED}'."
            echo "::error::Update the 'image' field in src/.devcontainer/devcontainer.json to match, or build the tag it already pins."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # src/.devcontainer, not the repo root: the Dockerfile does 'COPY setup.sh', which is
          # resolved relative to the build context. Pointing this at '.' looks harmless but fails
          # the build outright, because there is no setup.sh at the repo root.
          context: src/.devcontainer
          file: src/.devcontainer/Dockerfile
          # Native Linux laptops and lab PCs are amd64. See the macos branch for the arm64 build.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ (github.event_name == 'push' || inputs.push_latest) && format('{0}:latest', steps.meta.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the four things that actually break in front of a class: no simulation stack, no
      # display tooling, a missing setup.sh, or a workspace the 'team' user cannot write to.
      - name: Smoke test the published image
        run: |
          IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker pull "$IMAGE"

          echo "--- core ROS packages resolve? ---"
          docker run --rm "$IMAGE" bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 pkg prefix navigation2 && ros2 pkg prefix slam_toolbox && ros2 pkg prefix rviz2'

          echo "--- gazebo baked in, not apt-installed at runtime? ---"
          docker run --rm "$IMAGE" bash -lc \
            'source /opt/ros/humble/setup.bash && ros2 pkg prefix gazebo_ros'

          echo "--- X client tooling present? ---"
          docker run --rm "$IMAGE" bash -lc 'command -v xeyes'

          echo "--- setup.sh present and executable? ---"
          docker run --rm "$IMAGE" test -x /usr/local/bin/setup.sh \
            || { echo "::error::setup.sh missing from the image - postCreateCommand would fail for every student."; exit 1; }

          echo "--- workspace writable by the 'team' user? ---"
          docker run --rm "$IMAGE" bash -lc \
            'touch /home/ros2_ws/build/.write-test && rm /home/ros2_ws/build/.write-test' \
            || { echo "::error::/home/ros2_ws is not writable by 'team' - colcon build would fail on first start."; exit 1; }

      - name: Remind about package visibility
        run: |
          echo "### Published \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If this was the first push, the package is **private**. Machines cannot pull a private package without \`docker login\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Set it to Public under the package settings, then verify anonymously:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "R=${{ steps.meta.outputs.image_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'T=$(curl -s "https://ghcr.io/token?scope=repository:$R:pull&service=ghcr.io" | jq -r .token)' >> "$GITHUB_STEP_SUMMARY"
          echo 'curl -H "Authorization: Bearer $T" "https://ghcr.io/v2/$R/tags/list"' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
