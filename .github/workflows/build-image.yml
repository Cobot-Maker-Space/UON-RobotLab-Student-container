name: Build dev container image (macOS - uses the linux image)

# The macos branch publishes NO image of its own.
#
# It used to build an arm64 image here, but that can never work for this course: Gazebo Classic,
# which the TurtleBot3 Humble simulation depends on (turtlebot3_gazebo -> gazebo_ros_pkgs), has no
# arm64 packages in the ROS, Ubuntu or OSRF repositories. The build failed at apt-get with exit
# code 100 on ros-humble-gazebo-ros-pkgs and ros-humble-gazebo-plugins.
#
# Instead, src/.devcontainer/devcontainer.json on this branch pins the amd64 image published from
# the linux branch (robotlab-devcontainer-linux), and Docker Desktop runs it under Rosetta on
# Apple Silicon. To publish a new image for Macs, run this workflow from the LINUX branch, then
# update the tag in this branch's devcontainer.json to match.
#
# This file is kept (rather than deleted) so that choosing "Use workflow from: macos" in the
# Actions tab fails immediately with that explanation instead of something confusing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. humble-sim-2026-09). Must match the pin in devcontainer.json."
        required: true
        default: humble-sim-2026-09
      push_latest:
        description: "Also move the ':latest' tag on the package."
        type: boolean
        required: false
        default: true

jobs:
  wrong-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Explain that macos uses the linux image
        run: |
          echo "::error::The macos branch publishes no image. Macs run the amd64 image from the linux branch under Rosetta."
          echo "::error::Re-run this workflow with 'Use workflow from' set to linux, then update the tag in macos's devcontainer.json."
          {
            echo "### Nothing was built"
            echo ""
            echo "\`macos\` has no image of its own: Gazebo Classic has no arm64 packages, so Macs run"
            echo "\`ghcr.io/cobot-maker-space/robotlab-devcontainer-linux\` (linux/amd64) under Rosetta."
            echo ""
            echo "1. Re-run this workflow with **Use workflow from** set to \`linux\`."
            echo "2. If you published a new tag, update the \`image\` field in \`src/.devcontainer/devcontainer.json\` on \`macos\` to match."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
